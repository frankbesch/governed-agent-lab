<svg viewBox="0 0 360 845" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>One model call</title>
<desc>Hermes runs in the NemoClaw sandbox and holds only a placeholder key. Its model call goes to the OpenShell proxy, which checks the host allow list and injects the agent&#x27;s virtual key; then to fwd.py on the host, port 4100 to 4000; then to the LiteLLM gateway (key, model access, budget, fallback, guardrails); then to the NVIDIA endpoint, Nemotron 3 Ultra. The provider key stays in LiteLLM. LiteLLM traces each call to Langfuse. A direct call from the sandbox to the model is refused at the proxy with 403.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
<rect width="360" height="845" rx="6" fill="#12142A"/>
<text x="16" y="30" font-size="15" fill="#E2E4F4" font-weight="600" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>One model call</text>
<line x1="16" y1="42" x2="344" y2="42" stroke="#30365A"/>
<rect x="16" y="56" width="328" height="70" rx="5" fill="#202542" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="79" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Hermes agent</text>
<text x="180" y="97" font-size="12" fill="#A3A8C6" text-anchor="middle">in the NemoClaw sandbox;</text>
<text x="180" y="113" font-size="12" fill="#E2E4F4" text-anchor="middle">holds a placeholder key</text>
<path d="M180 128 L180 178" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,170 185,170 180,178" fill="#A3A8C6"/>
<rect x="16" y="182" width="328" height="70" rx="5" fill="#202542" stroke="#D17276" stroke-width="1.5"/>
<text x="180" y="205" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">OpenShell proxy</text>
<text x="180" y="223" font-size="12" fill="#A3A8C6" text-anchor="middle">host allow list; injects</text>
<text x="180" y="239" font-size="12" fill="#E2E4F4" text-anchor="middle">the agent&#x27;s virtual key</text>
<path d="M180 254 L180 304" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,296 185,296 180,304" fill="#A3A8C6"/>
<rect x="16" y="308" width="328" height="70" rx="5" fill="#202542" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="331" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">Forwarder</text>
<text x="180" y="349" font-size="12" fill="#A3A8C6" text-anchor="middle">fwd.py on the host,</text>
<text x="180" y="365" font-size="12" fill="#E2E4F4" text-anchor="middle">:4100 to :4000</text>
<path d="M180 380 L180 430" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,422 185,422 180,430" fill="#A3A8C6"/>
<rect x="16" y="434" width="328" height="70" rx="5" fill="#202542" stroke="#6DA361" stroke-width="1.5"/>
<text x="180" y="457" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">LiteLLM gateway</text>
<text x="180" y="475" font-size="12" fill="#A3A8C6" text-anchor="middle">key, model access, budget,</text>
<text x="180" y="491" font-size="12" fill="#E2E4F4" text-anchor="middle">fallback, guardrails</text>
<path d="M180 506 L180 556" fill="none" stroke="#A3A8C6" stroke-width="1.5"/><polygon points="175,548 185,548 180,556" fill="#A3A8C6"/>
<rect x="16" y="560" width="328" height="70" rx="5" fill="#202542" stroke="#A3A8C6" stroke-width="1.5"/>
<text x="180" y="583" font-size="12.5" fill="#E2E4F4" text-anchor="middle" font-weight="600">NVIDIA endpoint</text>
<text x="180" y="601" font-size="12" fill="#A3A8C6" text-anchor="middle">Nemotron 3 Ultra; the</text>
<text x="180" y="617" font-size="12" fill="#E2E4F4" text-anchor="middle">provider key stays in LiteLLM</text>
<text x="16" y="656" font-size="12" fill="#A3A8C6" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>LiteLLM sends a trace of each call to Langfuse. A direct call</text>
<text x="16" y="673" font-size="12" fill="#A3A8C6" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>from the sandbox to the model is refused at the proxy: 403</text>
<text x="16" y="690" font-size="12" fill="#A3A8C6" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>(L5).</text>
</svg>
